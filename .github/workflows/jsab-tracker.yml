name: JSAB Twitch Tracker

on:
  schedule:
    # Every 30 minutes -- stays safely under a private repo's 2,000 free
    # Actions minutes/month. Once you go public, minutes are unlimited,
    # so feel free to change this to */5 for faster checks if you want.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

# Needed so the job can commit the updated state file back to the repo.
permissions:
  contents: write

# Prevents two runs from overlapping and racing on the state file if one
# run happens to take longer than the interval.
concurrency:
  group: jsab-tracker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one poll cycle
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_ONCE: "true"
        run: python jsab_tracker.py

      - name: Persist state back to the repo
        run: |
          if [ -n "$(git status --porcelain jsab_tracker_state.json)" ]; then
            git config user.name "jsab-tracker-bot"
            git config user.email "actions@users.noreply.github.com"
            git add jsab_tracker_state.json
            git commit -m "Update tracker state"
            git push
          else
            echo "No state changes to commit."
          fi
